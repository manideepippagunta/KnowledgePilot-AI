services:
  knowledgepilot:
    build: .
    container_name: knowledgepilot-ai
    ports:
      - "8000:8000"
    environment:
      - KNOWLEDGEPILOT_HOST=0.0.0.0
      - KNOWLEDGEPILOT_PORT=8000
      - KNOWLEDGEPILOT_GENERATOR_PROVIDER=ollama
      - KNOWLEDGEPILOT_OLLAMA_BASE_URL=http://ollama:11434
      - KNOWLEDGEPILOT_OLLAMA_MODEL=llama3.2:3b
      - KNOWLEDGEPILOT_STORAGE_PATH=/app/data/index_state.json
    volumes:
      - kp_data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: knowledgepilot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  kp_data:
  ollama_models:
